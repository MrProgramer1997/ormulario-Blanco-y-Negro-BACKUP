:root {
  color-scheme: light;
  --ink: #1c2026; --muted: #626975; --paper: #f2f3f5; --white: #ffffff;
  --surface: #fff; --surface-alt: #f7f8fa; --line: #dfe3e8; --line-strong: #c5ccd6;
  --dark: #171a20; --accent: #242830; --accent-soft: #f5efe4;
  --gold: #d7ba87; --gold-ink: #755425; --gold-line: #cfb889;
  --danger: #aa332d; --danger-soft: #fff1ef; --success: #267153; --success-soft: #eaf6ef;
  --warn: #886019; --warn-soft: #fff4de;
  --radius: 20px; --shadow: 0 5px 24px #20293806;
  --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #edf0f4; --muted: #b0b8c4; --paper: #101216; --white: #1b1f26;
  --surface: #1b1f26; --surface-alt: #22272f; --line: #343b47; --line-strong: #566170;
  --accent: #e3cba2; --accent-soft: #302b23; --gold-ink: #e3cba2; --gold-line: #9d855d;
  --danger: #ffb0a8; --danger-soft: #3b2426; --success: #88d5ac; --success-soft: #1d352b;
  --warn: #ebc47e; --warn-soft: #352d20; --shadow: 0 6px 30px #00000016;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
body { margin: 0; font: 15px/1.55 var(--font); background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
button, a, input, select, summary { touch-action: manipulation; }
button { cursor: pointer; }
a { color: inherit; }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--gold-ink); outline-offset: 4px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold-ink); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { overflow-wrap: break-word; }
.ui-icon { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: middle; }
.skip { position: absolute; left: 12px; top: 12px; z-index: 99; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
.skip:focus { position: fixed; width: auto; height: auto; clip-path: none; background: var(--surface); color: var(--ink); padding: 14px; border-radius: 8px; }
/* Shared masthead */
.site-header { min-height: 96px; padding: 18px max(28px, calc((100vw - 1280px)/2)); display: flex; justify-content: space-between; align-items: center; gap: 24px; background: #171a1f; color: #f8f8f8; border-bottom: 1px solid #343336; }
.brand { text-decoration: none; display: flex; gap: 15px; align-items: center; flex: none; }
.brand-sign { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #8e7b5c; border-radius: 50%; font: 20px Georgia,serif; color: #e7d4b3; letter-spacing: -2px; }
.brand-sign>span { font-size: 13px; margin: 0 2px; }
.brand-copy { display: block; }
.brand-small { display: block; font-size: 9px; letter-spacing: 2.1px; color: #bfc1c8; margin-bottom: 4px; font-weight: 600; }
.brand-name { font: 28px/1.1 Georgia,"Times New Roman",serif; }
.brand-name em { font-weight: 400; color: #d7ba87; }
.brand-year { color: #c1b69f; font: 10px var(--font); letter-spacing: 1.5px; margin-left: 4px; }
.site-header nav { display: flex; gap: 22px; align-items: center; font-size: 13px; }
.help-link { text-decoration: none; color: #e5e5e7; }
.help-link:hover { color: #efd5a8; }
.admin-link { border: 1px solid #535051; padding: 10px 15px; border-radius: 10px; font-size: 12px; text-decoration: none; display: inline-flex; gap: 9px; align-items: center; min-height: 44px; }
.admin-link .ui-icon { width: 16px; height: 16px; color: #e0c495; }
.theme-toggle { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #535051; border-radius: 50%; background: transparent; color: #e8cda0; }
.theme-toggle:hover, .admin-link:hover { background: #303138; border-color: #a19178; }
.site-header .button.secondary { border-color: #535051; background: transparent; color: #fff; }
.site-header .button.secondary:hover { background: #303138; }
.mode-banner { padding: 9px 24px; font-size: 12px; text-align: center; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--line); }
.mode-banner strong { font-weight: 700; letter-spacing: .4px; }
/* Event invitation */
.page { max-width: 1344px; padding: 30px 32px 0; margin: auto; }
.hero { display: grid; grid-template-columns: 1.35fr .8fr; position: relative; overflow: hidden; border-radius: 24px; background: #191c22; color: #fafafa; border: 1px solid #39393c; min-height: 330px; box-shadow: 0 16px 35px #151b2510; }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 80% 80%,#b68e4316,transparent 70%),linear-gradient(120deg,#ffffff04,transparent 50%); }
.hero-orbit { position: absolute; width: 590px; height: 590px; top: -310px; left: 32%; border: 1px solid #d4ba871e; border-radius: 50%; pointer-events: none; }
.hero-orbit::after { content: ""; position: absolute; inset: 40px; border: 1px solid #d4ba8713; border-radius: 50%; }
.hero-copy { padding: 37px 44px; z-index: 1; }
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 650; letter-spacing: 2.8px; color: #d5bb90; }
.fine-line { width: 28px; border-top: 1px solid #d5bb90; }
h1 { font: 55px/1.08 Georgia,serif; letter-spacing: -1.5px; }
.hero h1 { font-size: clamp(42px,4.8vw,65px); margin: 21px 0 14px; font-weight: 400; letter-spacing: -2.2px; white-space: nowrap; }
.hero h1 em { color: #dbc298; font-weight: 400; font-size: .88em; }
.hero-edition { display: block; font: 10px var(--font); letter-spacing: 5px; margin: 13px 0 0 4px; color: #bcbec6; }
.hero .hero-intro { font-size: 14px; color: #c6c8cf; margin: 17px 0 20px; }
.hero-date { display: flex; gap: 9px; align-items: center; font-size: 12px; color: #eee9df; flex-wrap: wrap; }
.hero-date .ui-icon { width: 17px; height: 17px; color: #d7ba87; }
.hero-date strong { font-weight: 600; }
.hero-date-separator { height: 12px; border-left: 1px solid #68635c; margin: 0 2px; }
.hero-meta { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 13px; color: #b9bec8; font-size: 11px; }
.hero-meta span { display: flex; align-items: center; gap: 7px; }
.hero-meta .ui-icon { width: 15px; height: 15px; }
.hero-side { position: relative; margin: 28px 28px 28px 0; padding: 25px 29px 18px; border: 1px solid #6c604849; border-radius: 18px; background: #24262b; z-index: 1; }
.artist-label { color: #dcc398; font-size: 9px; letter-spacing: 2px; display: flex; align-items: center; gap: 9px; }
.live-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #e9c785; box-shadow: 0 0 0 4px #dbb77313; }
.hero-side h2 { font: 32px/1.1 Georgia,serif; margin: 14px 0 20px; letter-spacing: -.25px; font-weight: 400; }
.hero-side h2 span { display: inline-block; font: 11px var(--font); color: #c9ccd3; margin-left: 8px; }
.price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding-top: 16px; border-top: 1px solid #ffffff22; }
.price-row small { display: block; font-size: 11px; color: #bfc3cd; }
.price-row strong { display: block; color: #edd7b0; font-size: 23px; font-weight: 600; letter-spacing: -.4px; margin-top: 2px; }
.hero .dress-code { color: #b8bdc7; font-size: 10px; margin: 13px 0 0; }
/* Booking workspace */
.booking { padding-top: 37px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 20px; }
.overline { font-size: 10px; color: var(--muted); letter-spacing: 1.9px; font-weight: 650; }
.section-heading h2 { margin: 4px 0 0; font-size: 28px; font-weight: 650; line-height: 1.3; letter-spacing: -.8px; }
.secure-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.secure-label .ui-icon { color: var(--gold-ink); width: 19px; }
.stepper { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 22px; }
.step-button { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; display: flex; align-items: center; gap: 12px; text-align: left; padding: 17px; color: var(--muted); position: relative; }
.step-button:disabled { opacity: 1; cursor: default; }
.step-num { width: 34px; height: 34px; display: grid; place-items: center; flex: none; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; font-weight: 650; }
.step-copy { display: flex; flex-direction: column; gap: 2px; }
.step-copy strong { font-size: 13px; font-weight: 600; }
.step-copy small { font-size: 11px; font-weight: 400; }
.step-icon { margin-left: auto; opacity: .65; }
.step-icon .ui-icon { width: 19px; height: 19px; }
.step-button.active { border-color: #282c33; background: #22262d; color: #fff; box-shadow: 0 5px 10px #10141a12; }
.step-button.active .step-num { background: #dfc493; color: #26221b; border-color: #dfc493; }
.step-button.active small { color: #ccd0d8; }
.step-button.active .step-icon { color: #e1c697; opacity: 1; }
.step-button.done { border-color: var(--gold-line); }
.step-button.done .step-num { color: var(--gold-ink); background: var(--accent-soft); border-color: transparent; }
.booking-grid { display: grid; grid-template-columns: minmax(0,1fr) 310px; gap: 24px; align-items: start; }
.form-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); min-height: 320px; }
.form-title-row { display: flex; align-items: flex-start; gap: 13px; margin-bottom: 25px; }
.form-title-row>div { flex: 1; min-width: 0; }
.section-index { width: 42px; height: 42px; border-radius: 12px; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--gold-ink); flex: none; }
.form-card h2 { font-size: 21px; line-height: 1.3; margin: 0 0 6px; font-weight: 650; letter-spacing: -.5px; }
.form-card h3 { font-size: 16px; font-weight: 650; margin: 0 0 8px; }
.subtext { font-size: 13px; margin: 0; color: var(--muted); }
.step-tag { font-size: 9px; color: var(--muted); background: var(--surface-alt); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; white-space: nowrap; margin-top: 3px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
/* Map and accessible table alternatives */
.map-controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.legend { display: flex; gap: 13px; font-size: 11px; flex-wrap: wrap; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #388565; }
.dot.held { background: #c3963e; }
.dot.occupied { background: #7c8695; }
.text-button { border: 0; background: transparent; color: var(--gold-ink); font-size: 12px; padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; display: inline-flex; align-items: center; gap: 7px; }
.text-button .ui-icon { width: 16px; height: 16px; }
.map-zoom { text-decoration: none; border: 1px solid var(--line); padding: 8px 11px; border-radius: 8px; color: var(--ink); background: var(--surface-alt); }
.map { position: relative; border-radius: 12px; overflow: hidden; background: #161719; border: 1px solid #393c43; }
.map>img { display: block; width: 100%; height: auto; }
.map-marker { position: absolute; transform: translate(-50%,-50%); width: 3.8%; aspect-ratio: 1; border: 1.5px solid #e6e2d7; border-radius: 50%; background: #f7f4ed; color: #20252a; padding: 0; display: grid; place-items: center; font-size: clamp(8px,1vw,12px); font-weight: 750; box-shadow: 0 2px 6px #0009; line-height: 1; }
.map-marker:hover:not(:disabled) { background: #efd7ad; transform: translate(-50%,-50%) scale(1.13); z-index: 3; }
.map-marker.selected { background: #e7be78; border-color: #ffeed0; color: #191d22; box-shadow: 0 0 0 3px #eccf9370,0 2px 8px #000b; z-index: 2; }
.map-marker.held { background: #885f18; color: white; border-color: #e9c17d; }
.map-marker.occupied,.map-marker.confirmed,.map-marker.blocked { background: #4e535b; color: white; border-color: #959ca9; }
.map-marker:disabled { opacity: 1; }
.map-tip { color: var(--muted); font-size: 11px; margin: 11px 0 20px; }
.table-picker { padding-top: 20px; border-top: 1px solid var(--line); }
.picker-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; }
.picker-heading h3 { font-size: 13px; margin: 0; }
.segmented { display: flex; gap: 2px; background: var(--surface-alt); border: 1px solid var(--line); padding: 3px; border-radius: 9px; }
.segmented button { padding: 8px 10px; border: 0; border-radius: 6px; font-size: 11px; background: transparent; color: var(--muted); }
.segmented button.active { background: var(--surface); box-shadow: 0 1px 6px #00000012; color: var(--ink); font-weight: 600; }
.table-grid { display: grid; grid-template-columns: repeat(9,minmax(0,1fr)); gap: 7px; }
.table-cell { border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface-alt); color: var(--ink); font-size: 13px; font-weight: 650; min-height: 45px; padding: 6px 2px; position: relative; }
.table-cell:hover:not(:disabled) { border-color: var(--gold-line); background: var(--accent-soft); }
.table-cell.selected { background: #262a32; color: #efd7af; border-color: #ac8f61; box-shadow: inset 0 0 0 1px #ac8f61; }
.table-cell.held { background: var(--warn-soft); color: var(--warn); border-color: var(--gold-line); }
.table-cell.occupied,.table-cell.confirmed,.table-cell.blocked { background: var(--line); color: var(--muted); text-decoration: line-through; }
.table-cell:disabled { opacity: 1; }
.table-cell small { display: block; font-size: 9px; font-weight: 400; margin-top: 3px; text-decoration: none; }
.selected-box { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-top: 18px; border: 1px solid var(--gold-line); border-radius: 10px; background: var(--accent-soft); color: var(--gold-ink); font-size: 12px; }
.selected-box strong { display: block; font-weight: 650; }
.check-icon { font-size: 20px; flex: none; }
/* Navigation and primary actions */
.form-navigation { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 2px 0; }
.form-navigation .primary { margin-left: auto; min-width: 185px; }
.form-navigation .muted { font-size: 12px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 13px 21px; min-height: 48px; border: 1px solid transparent; border-radius: 10px; font-size: 13px; font-weight: 650; text-decoration: none; line-height: 1.3; transition: background .15s,box-shadow .15s,transform .15s; }
.button.primary { background: #252a32; color: #fff; border-color: #252a32; box-shadow: 0 4px 10px #13182210; }
.button.primary:hover { background: #3a3e47; box-shadow: 0 4px 12px #13182225; }
:root[data-theme="dark"] .button.primary { background: #e1c89c; color: #202329; border-color: #e1c89c; }
:root[data-theme="dark"] .button.primary:hover { background: #efdab6; }
.button.secondary { color: var(--ink); background: var(--surface); border-color: var(--line-strong); }
.button.secondary:hover { background: var(--surface-alt); border-color: var(--gold-line); }
.button.ghost { color: var(--ink); border-color: var(--line); background: transparent; }
.button.danger { background: #a93630; color: white; }
.full { width: 100%; }
.privacy-footnote { font-size: 11px; line-height: 1.6; color: var(--muted); margin: 15px 4px 0; }
/* Reservation ticket - deliberately dark in both themes */
.summary { color: #f3f2f0; background: #23272f; border: 1px solid #3c414a; border-radius: var(--radius); padding: 24px; position: sticky; top: 22px; box-shadow: 0 10px 24px #12151c0e; overflow: hidden; }
.summary::before { content: ""; position: absolute; top: 0; left: 25px; right: 25px; height: 2px; background: linear-gradient(90deg,transparent,#d7bb88,transparent); }
.summary-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.summary .overline { font-size: 9px; letter-spacing: 1.2px; color: #d5bd96; }
.pill { display: inline-flex; white-space: nowrap; align-items: center; gap: 5px; font-size: 9px; border: 1px solid var(--line); background: var(--surface-alt); border-radius: 6px; padding: 4px 7px; }
.summary .pill { background: #2e333c; color: #d4d9e1; border-color: #494e58; }
.summary-table { display: flex; gap: 13px; align-items: center; padding: 25px 0 21px; border-bottom: 1px dashed #535965; margin-bottom: 20px; }
.table-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: #3b3934; color: #e2c18e; border: 1px solid #6d5b4150; }
.table-icon .ui-icon { width: 23px; height: 23px; }
.summary-table strong { display: block; font-size: 21px; font-weight: 600; letter-spacing: -.3px; }
.summary-table small { color: #bfc7d2; display: block; font-size: 12px; margin-top: 2px; }
.summary-lines>div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 13px 0; font-size: 12px; }
.summary-lines span { color: #c2c8d2; }
.summary-lines strong { font-weight: 600; white-space: nowrap; }
.summary-total { margin-top: 21px; padding: 17px 17px 16px; border-radius: 12px; background: #31343a; border: 1px solid #706048; }
.summary-total>span { font-size: 12px; color: #e4e3e0; font-weight: 550; }
.summary-total small { display: block; color: #c0c4ca; font-size: 10px; font-weight: 400; margin-top: 2px; }
.summary-total>strong { display: block; font-size: 28px; font-weight: 600; letter-spacing: -.6px; color: #f1d6a8; margin-top: 8px; }
.summary-info { font-size: 11px; line-height: 1.65; color: #c1c7d1; margin: 17px 0; }
.summary-bottom { display: flex; align-items: flex-start; gap: 10px; color: #d7dbdf; font-size: 11px; padding-top: 16px; border-top: 1px solid #424854; }
.summary-bottom .ui-icon { color: #ddbf8c; width: 18px; height: 18px; }
.conditions-mini { color: #bec6d0; font-size: 11px; padding-top: 17px; margin-top: 18px; border-top: 1px dashed #535965; }
.conditions-mini strong { color: #eceef0; font-weight: 600; }
summary { cursor: pointer; }
/* Form details */
.form-subheading { display: flex; align-items: center; gap: 8px; margin: 5px 0 17px; font-size: 13px; font-weight: 600; }
.form-subheading>.ui-icon { color: var(--gold-ink); width: 18px; height: 18px; }
.form-subheading small { margin-left: auto; font-size: 10px; color: var(--muted); font-weight: 400; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field.wide { grid-column: 1/-1; }
.field label { font-size: 13px; font-weight: 600; }
.field input,.field select,.search-input { width: 100%; min-height: 51px; padding: 13px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-alt); color: var(--ink); font-size: 15px; transition: border-color .15s,background .15s; }
.field input:hover,.field select:hover { border-color: var(--gold-line); }
.field input:focus,.field select:focus { background: var(--surface); }
.field input::placeholder { color: var(--muted); opacity: 1; font-size: 13px; }
.field input[readonly] { background: var(--surface-alt); color: var(--muted); border-style: dashed; }
.field small { font-size: 11px; color: var(--muted); }
.field input[aria-invalid=true],.field select[aria-invalid=true] { border-color: var(--danger); background: var(--danger-soft); }
.field-error { color: var(--danger) !important; font-size: 11px; }
.group-section { margin-top: 27px; padding-top: 25px; border-top: 1px solid var(--line); }
.group-section h3 { font-size: 17px; }
.quantity-group { display: flex; gap: 12px; margin-top: 16px; }
.quantity-option { flex: 1; display: flex; gap: 8px; align-items: baseline; justify-content: center; position: relative; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); min-height: 66px; padding: 13px 8px; }
.quantity-option>strong { font-size: 25px; font-weight: 600; }
.quantity-option>span { font-size: 12px; }
.quantity-option.active { color: var(--gold-ink); background: var(--accent-soft); border-color: var(--gold-line); box-shadow: inset 0 0 0 1px var(--gold-line); }
.quantity-check { display: none; position: absolute; top: 3px; right: 5px; }
.quantity-check .ui-icon { width: 12px; height: 12px; }
.quantity-option.active .quantity-check { display: block; }
.distribution { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 18px; }
.count-card { display: flex; justify-content: space-between; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 12px; padding: 17px 14px; background: var(--surface-alt); }
.count-title { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 650; }
.count-title .ui-icon { width: 16px; height: 16px; color: var(--gold-ink); }
.count-card small { display: block; color: var(--muted); font-size: 10px; margin-top: 5px; }
.count-card strong { font-size: 29px; font-weight: 500; }
.counter { display: flex; align-items: center; gap: 8px; flex: none; }
.counter button { width: 36px; height: 40px; border: 1px solid var(--line-strong); border-radius: 9px; font-size: 22px; line-height: 1; background: var(--surface); color: var(--ink); }
.counter button:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--gold-line); }
.counter output { font-size: 24px; min-width: 17px; text-align: center; }
.checkbox-row { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; cursor: pointer; margin-top: 18px; }
.checkbox-row input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--gold-ink); flex: none; }
.checkbox-row small { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
.inline-select { max-width: 235px; margin: 12px 0 0 31px; }
.draft-controls { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 24px; }
.draft-controls .checkbox-row { margin: 0; }
.draft-controls p { margin: 6px 0 0 31px; }
.progress-label { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; margin: 0 0 10px; }
.progress-track { height: 6px; border-radius: 8px; overflow: hidden; margin-bottom: 23px; background: var(--line); }
.progress-fill { height: 100%; background: var(--gold-ink); transition: width .2s; }
.attendee-section-title { display: flex; justify-content: space-between; gap: 15px; font-size: 12px; align-items: center; margin: 24px 0 12px; }
.attendee-section-title strong { font-weight: 650; }
.attendee-section-title .muted { font-size: 11px; }
.attendee { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 11px; overflow: hidden; background: var(--surface); }
.attendee>summary { display: flex; align-items: center; gap: 12px; padding: 17px; list-style: none; font-size: 13px; }
.attendee>summary::-webkit-details-marker { display: none; }
.attendee>summary::after { content: '+'; width: 24px; height: 24px; border: 1px solid var(--line-strong); border-radius: 7px; display: grid; place-items: center; font-size: 16px; color: var(--muted); flex: none; }
.attendee[open] { border-color: var(--gold-line); }
.attendee[open]>summary::after { content: '\2212'; }
.attendee[open]>summary { background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.person-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.person-number { display: block; font-size: 10px; font-weight: 550; letter-spacing: .45px; color: var(--muted); margin-bottom: 4px; }
.attendee .fields { padding: 20px; }
.badge { display: inline-flex; gap: 5px; align-items: center; border-radius: 6px; padding: 4px 8px; font-size: 10px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; flex: none; }
.badge.complete,.badge.confirmed { color: var(--success); background: var(--success-soft); }
.badge.complete::before { content: '\2713'; font-weight: 700; }
.badge.payment_pending,.badge.held,.badge.created,.badge.opening { color: var(--warn); background: var(--warn-soft); }
.badge.expired,.badge.declined,.badge.cancelled { color: var(--muted); background: var(--surface-alt); }
.badge.review { background: var(--danger-soft); color: var(--danger); }
.attendee.error { border-color: var(--danger); }
.review-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 19px 0 10px; }
.review-block { background: var(--surface-alt); border: 1px solid var(--line); border-radius: 12px; padding: 18px; font-size: 13px; overflow-wrap: anywhere; }
.review-block p { margin: 4px 0; }
.review-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.review-table td { padding: 12px 6px; border-bottom: 1px solid var(--line); }
.review-table td:last-child { font-size: 11px; text-align: right; color: var(--muted); }
.payment-note { padding: 17px; border: 1px solid var(--gold-line); border-radius: 12px; background: var(--accent-soft); color: var(--gold-ink); margin-top: 22px; font-size: 12px; }
.payment-note p { margin: 6px 0 0; }
.error-box { padding: 15px 17px; margin-bottom: 15px; background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-radius: 10px; font-size: 13px; }
.notice-box { padding: 15px; margin: 15px 0; border: 1px solid var(--gold-line); border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 12px; }
.success-box { background: var(--success-soft); color: var(--success); border: 1px solid var(--success); border-radius: 10px; padding: 16px; font-size: 13px; }
/* Help, policy and footer */
.help-card { display: flex; align-items: center; gap: 19px; padding: 25px 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-top: 30px; }
.help-icon { width: 49px; height: 49px; display: grid; place-items: center; border: 1px solid var(--gold-line); background: var(--accent-soft); border-radius: 14px; color: var(--gold-ink); flex: none; }
.help-icon .ui-icon { width: 24px; height: 24px; }
.help-card>div { flex: 1; }
.help-card h3 { font-size: 18px; font-weight: 650; margin: 3px 0 4px; letter-spacing: -.3px; }
.help-card p { font-size: 12px; margin: 0; color: var(--muted); }
.help-card .button { white-space: nowrap; font-size: 12px; }
.protocol { border-bottom: 1px solid var(--line); padding: 23px 0; font-size: 12px; }
.protocol>summary { font-size: 13px; font-weight: 550; padding: 8px 0; }
.protocol-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 14px 0; }

.footer { max-width: 1344px; display: flex; justify-content: space-between; gap: 18px; align-items: center; padding: 26px 32px 35px; margin: auto; color: var(--muted); font-size: 11px; }
.mobile-total { display: none; }
/* Dialogs and payment result */
dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 25px; box-shadow: 0 25px 100px #0006; }
dialog::backdrop { background: #11151cbd; backdrop-filter: blur(6px); }
.dialog-header { display: flex; gap: 18px; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.dialog-header h2 { font-size: 21px; margin: 0 0 7px; font-weight: 650; letter-spacing: -.3px; }
.dialog-header p { font-size: 12px; color: var(--muted); margin: 0; }
.icon-button { width: 40px; height: 40px; border: 1px solid var(--line-strong); background: var(--surface-alt); color: var(--ink); border-radius: 50%; flex: none; }
.map-dialog { max-width: min(1280px,95vw); width: 95vw; max-height: 92vh; }

.map-dialog .map-marker { font-size: 15px; }
.notice-dialog { width: calc(100% - 32px); max-width: 540px; }

.result-container { max-width: 650px; margin: 50px auto; padding: 0 15px; }

.status-symbol { width: 60px; height: 60px; display: grid; place-items: center; background: var(--accent-soft); color: var(--gold-ink); border-radius: 16px; font-size: 26px; margin-bottom: 19px; }
.result-title { font: 28px/1.2 var(--font); letter-spacing: -.7px; font-weight: 650; }
.result-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 25px; }
/* Administration */
.admin-page { max-width: 1344px; padding: 30px 32px 45px; margin: auto; }
.admin-heading { background: #20242b; color: #f4f4f4; border: 1px solid #393e47; border-radius: 20px; padding: 29px 32px; display: flex; justify-content: space-between; gap: 25px; align-items: center; position: relative; overflow: hidden; }
.admin-heading::after { content: ""; position: absolute; pointer-events: none; width: 480px; height: 480px; right: 9%; top: -260px; border: 1px solid #d5b77d17; border-radius: 50%; }
.admin-heading .overline { color: #dcc7a2; font-size: 9px; }
.admin-heading-tag { display: inline-flex; border: 1px solid #807055; border-radius: 5px; font-size: 8px; padding: 3px 6px; margin-left: 11px; letter-spacing: .7px; }
.admin-heading h1 { font: 32px/1.15 var(--font); font-weight: 600; letter-spacing: -.9px; margin: 14px 0 10px; }
.admin-heading p { font-size: 12px; color: #bbc3d0; margin: 0; }
.admin-actions { display: flex; align-items: center; gap: 10px; z-index: 1; }
.admin-actions .button.primary { background: #dfc493; border-color: #dfc493; color: #22262c; }
.admin-actions .button.secondary { background: #2f353f; color: #e8eaee; border-color: #525b6a; }
.admin-tabs { display: flex; gap: 5px; padding: 5px; margin: 22px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }

.admin-tabs .ui-icon { width: 17px; height: 17px; }
.admin-tabs button.active { background: #272c34; color: #f4dfbb; font-weight: 600; }
.kpi-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 19px 20px; box-shadow: var(--shadow); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }

.kpi-icon { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 9px; background: var(--surface-alt); color: var(--gold-ink); flex: none; }
.kpi-icon .ui-icon { width: 17px; height: 17px; }
.kpi>strong { display: block; font-size: 35px; font-weight: 650; line-height: 1.2; margin: 12px 0; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }

.admin-card h2 { font-size: 18px; font-weight: 650; letter-spacing: -.3px; margin: 0 0 7px; }
.admin-card>p { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
.admin-card-title { display: flex; gap: 11px; align-items: center; margin-bottom: 16px; }
.admin-card-title h2 { margin: 0; }
.admin-card-title .section-index { width: 34px; height: 34px; border-radius: 10px; }
.admin-card-title .ui-icon { width: 17px; height: 17px; }
.admin-card-title .text-button { margin-left: auto; font-size: 11px; white-space: nowrap; }
.occupancy-track { display: flex; height: 16px; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 25px 0 15px; }
.occupancy-track span { height: 100%; }
.occupancy-track .confirmed { background: #448267; }
.occupancy-track .held { background: #c7a465; }
.occupancy-legend { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
.metric-list { margin-top: 19px; }
.metric-list>div { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 12px; }

.login-card { max-width: 465px; padding: 32px; margin: 48px auto; }

.login-emblem .ui-icon { width: 25px; height: 25px; }

.login-card .fields { grid-template-columns: 1fr; margin: 24px 0; }
.login-card .text-button { display: flex; margin: 12px auto 0; }
.table-toolbar { display: flex; gap: 15px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.table-toolbar p { margin-bottom: 0; }
.table-toolbar .search-input { max-width: 460px; }
.table-scroll { overflow: auto; max-height: 600px; border-radius: 10px; border: 1px solid var(--line); }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
.data-table th { background: var(--surface-alt); position: sticky; top: 0; padding: 14px; text-align: left; font-size: 10px; font-weight: 650; letter-spacing: .6px; color: var(--muted); }

.admin-card>.table-grid { grid-template-columns: repeat(11,minmax(0,1fr)); margin-bottom: 23px; }

.empty-state { padding: 45px 20px; text-align: center; font-size: 13px; color: var(--muted); }
.test-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 13px; margin: 25px 0; }
.test-option { padding: 20px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface-alt); color: var(--ink); text-align: left; }
.test-option small { display: block; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.test-option strong { display: block; font-size: 26px; margin-top: 6px; }
.test-option.active { background: var(--accent-soft); color: var(--gold-ink); border-color: var(--gold-line); box-shadow: inset 0 0 0 1px var(--gold-line); }
.connection-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 23px; }
.connection-list>div { display: flex; gap: 15px; align-items: baseline; justify-content: space-between; padding: 15px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
.banner-buttons { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.loading { opacity: .6; pointer-events: none; }
/* Responsive */

 const active=reservations.filter(r=>['confirmed','payment_pending'].includes(r.status));
 return {reservations,tables:TABLES.map(t=>({...t,status:active.find(r=>r.table_number===t.number)?.status==='confirmed'?'occupied':active.find(r=>r.table_number===t.number)?'held':'available'})),settings:{mode:'test',keysConfigured:false},legacyCount:0,source:'demo'};
}
function showLogin(message=''){
 $('logout').hidden=true;
 $('admin-root').innerHTML=`<section class="form-card login-card"><div class="login-emblem">${icon("lock")}</div><span class="overline">ACCESO PRIVADO</span><h1>Administraci&oacute;n de Eventos</h1><p class="subtext">Reservas, mesas, asistentes y seguimiento de pagos en un solo lugar.</p>${message?`<div class="error-box" role="alert">${e(message)}</div>`:''}<form id="login-form"><div class="fields"><div class="field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" value="EventosyServicios" required></div><div class="field"><label for="password">Contrase&ntilde;a</label><input id="password" name="password" type="password" autocomplete="current-password" required></div></div><p id="login-error" class="error-box" role="alert" hidden></p><button type="submit" class="button primary full" id="login-button">Ingresar</button></form>${CONFIG.preview?'<div class="notice-box">El acceso real se habilita al configurar Supabase Auth. La demostraci&oacute;n no necesita contrase&ntilde;a y solo muestra datos ficticios.</div><button type="button" class="text-button" id="demo-button">Ver demostraci&oacute;n del administrador</button>':''}</section>`;
 $('login-form').addEventListener('submit',async ev=>{ev.preventDefault();if(CONFIG.preview){$('login-error').textContent='Esta entrega est\u00e1 en vista previa. Usa la demostraci\u00f3n; no ingreses contrase\u00f1as reales.';$('login-error').hidden=false;return;}$('login-button').disabled=true;try{await login($('username').value,$('password').value);await load();}catch(err){$('login-error').textContent=err.message;$('login-error').hidden=false;}finally{if($('login-button'))$('login-button').disabled=false;}});
 $('demo-button')?.addEventListener('click',()=>{demo=true;data=sample();render();});
}
function summary(){
 const confirmed=data.reservations.filter(r=>r.status==='confirmed'),held=data.reservations.filter(r=>['held','opening','payment_pending'].includes(r.status));
 return {confirmed:confirmed.length,held:held.length,available:data.tables.filter(t=>t.status==='available').length,booked:confirmed.reduce((n,r)=>n+r.quantity,0),members:confirmed.reduce((n,r)=>n+r.member_count,0),guests:confirmed.reduce((n,r)=>n+r.guest_count,0),revenue:confirmed.reduce((n,r)=>n+r.amount,0),pending:held.reduce((n,r)=>n+r.amount,0)};
}
function kpi(label,value,note,featured=false,kind="grid"){return `<article class="kpi ${featured?'featured':''}"><div class="kpi-top"><small>${label}</small><span class="kpi-icon">${icon(kind)}</span></div><strong>${value}</strong><p>${note}</p></article>`;}
function dashboard(){const s=summary();return `<div class="kpi-grid">${kpi('Reservas confirmadas',s.confirmed,`${s.booked} asistentes confirmados`,false,'check')}${kpi('Mesas disponibles',s.available,`De ${data.tables.length} mesas configuradas`)}${kpi('Solicitudes en pago',s.held,'No se cuentan como venta confirmada',false,'clock')}${kpi(demo?'Pagos ficticios aprobados':'Pagos de prueba aprobados',money(s.revenue),demo?'Ejemplo visual, no es recaudo real':'Simulaciones, no es dinero recibido',true,'credit')}</div><div class="admin-two-col"><section class="admin-card"><div class="admin-card-title"><span class="section-index">${icon("grid")}</span><h2>Ocupaci&oacute;n de mesas</h2><button type="button" class="text-button" data-tab="tables">Ver mesas ${icon("arrow")}</button></div><p>Disponibilidad exclusiva del evento seleccionado, sin mezclar el hist&oacute;rico.</p><div class="occupancy-track"><span class="confirmed" style="width:${s.confirmed/data.tables.length*100}%"></span><span class="held" style="width:${s.held/data.tables.length*100}%"></span></div><div class="occupancy-legend"><span><i class="dot"></i> ${s.confirmed} confirmadas</span><span><i class="dot held"></i> ${s.held} en pago</span><span>${s.available} disponibles</span></div><div class="metric-list"><div><span>Cupos en mesas totalmente disponibles</span><strong>${s.available*10}</strong></div><div><span>Puestos confirmados de socios / corporados</span><strong>${s.members}</strong></div><div><span>Puestos confirmados de invitados</span><strong>${s.guests}</strong></div></div><p class="small muted" style="margin-top:16px">Los puestos sobrantes en una mesa confirmada no se ofrecen autom&aacute;ticamente a otro grupo.</p></section><section class="admin-card"><div class="admin-card-title"><span class="section-index">${icon("credit")}</span><h2>Control de pagos</h2></div><p>Una solicitud pendiente no confirma una mesa.</p><div class="metric-list"><div><span>Valor de solicitudes pendientes</span><strong>${money(s.pending)}</strong></div><div><span>Rechazadas / vencidas</span><strong>${data.reservations.filter(r=>['declined','expired'].includes(r.status)).length}</strong></div><div><span>Incidencias por revisar</span><strong>${data.reservations.filter(r=>r.status==='review').length}</strong></div></div><div class="notice-box">El modo de esta versi&oacute;n es <strong>PRUEBAS</strong>. No habilita cobros reales.</div></section></div>`;}
function reservationRows(){const rows=data.reservations.filter(r=>[r.invoice,r.responsible_name,r.table_number,stateLabels[r.status]].join(' ').toLowerCase().includes(query.toLowerCase()));return rows.length?rows.map(r=>`<tr><td>${e(r.invoice)}</td><td>${e(r.responsible_name)}</td><td>${r.table_number}</td><td>${r.quantity}</td><td><span class="badge ${e(r.status)}">${e(stateLabels[r.status]||r.status)}</span></td><td>${money(r.amount)}</td><td><button type="button" class="text-button" data-detail="${e(r.id)}">Ver detalle</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty-state">No hay reservas que coincidan con la b&uacute;squeda.</td></tr>';}
function reservations(){return `<section class="admin-card"><div class="table-toolbar"><div><h2>Reservas y solicitudes</h2><p class="small muted">${demo?'Registros ficticios de demostraci&oacute;n.':'Hasta 500 registros. No incluye el hist&oacute;rico anterior.'}</p></div><button type="button" class="button secondary" id="export-csv">Exportar CSV</button></div><div class="table-toolbar"><input type="search" class="search-input" id="reservation-search" placeholder="Buscar por responsable, mesa o referencia" aria-label="Buscar reservas" value="${e(query)}"></div><div class="table-scroll"><table class="data-table"><thead><tr><th>REFERENCIA</th><th>RESPONSABLE</th><th>MESA</th><th>PERSONAS</th><th>ESTADO</th><th>VALOR</th><th></th></tr></thead><tbody id="reservation-rows">${reservationRows()}</tbody></table></div></section>`;}
function tablePanel(){return `<section class="admin-card"><h2>Las 45 mesas del plano 2026</h2><p>Vista administrativa. Esta versi&oacute;n no permite liberar manualmente una mesa con un pago pendiente.</p><div class="legend" style="margin:18px 0"><span><i class="dot"></i> Disponible</span><span><i class="dot held"></i> En pago</span><span><i class="dot occupied"></i> Confirmada</span></div>${['Rialto','Lobby'].map(zone=>`<h3>${zone}</h3><div class="table-grid">${data.tables.filter(t=>t.zone===zone).map(t=>`<button type="button" class="table-cell ${t.status}" data-table-detail="${t.number}" title="Mesa ${t.number}">${t.number}<small>${t.status==='available'?'Libre':t.status==='held'?'En pago':'Reservada'}</small></button>`).join('')}</div>`).join('')}</section>`;}
function tests(){return `<section class="admin-card"><h2>Laboratorio de pagos</h2><p>Solo administradores. Usa mesas y reservas de ensayo separadas del evento real.</p><div class="test-grid">${TEST_CASES.map(t=>`<button type="button" class="test-option ${t.code===selectedTest?'active':''}" data-test="${t.code}"><small>PRUEBA ${t.code.slice(1)}</small><strong>${money(t.amount)}</strong></button>`).join('')}</div><div class="notice-box"><strong>No utiliza dinero real.</strong> El total de ensayo lo impone el servidor a partir del caso elegido. Cambiar el importe en el navegador no cambia el cobro.</div><a class="button primary" href="VISTA-PREVIA.html?test_case=${selectedTest}">Abrir formulario de ensayo &#8599;</a><div class="connection-list"><div><span>Modo del servidor</span><strong>${demo?'Demostraci&oacute;n':'Pruebas'}</strong></div><div><span>Llaves de ePayco</span><strong>${demo?'Sin comprobar':data.settings.keysConfigured?'Configuradas':'Pendientes'}</strong></div><div><span>Datos de tarjetas en el formulario</span><strong>No se solicitan</strong></div><div><span>Activaci&oacute;n de cobros reales</span><strong>Deshabilitada</strong></div></div></section>`;}
function history(){return `<section class="admin-card"><h2>Hist&oacute;rico anterior</h2><p>La actualizaci&oacute;n no borra ni renombra las tablas originales.</p>${demo?'<div class="notice-box">La demostraci&oacute;n no consulta reservas privadas anteriores.</div>':`<div class="notice-box">${data.legacyCount} registros conservados en la tabla original. La clasificaci&oacute;n por evento debe revisarse antes de una migraci&oacute;n definitiva; la fecha de creaci&oacute;n por s&iacute; sola no demuestra a qu&eacute; evento pertenece una reserva.</div><button class="button secondary" type="button" id="load-history">Consultar registros hist&oacute;ricos</button><div id="history-results"></div>`}</section>`;}
function render(){
 $('logout').hidden=false;$('admin-banner').hidden=false;$('admin-banner').innerHTML=demo?'<strong>DEMOSTRACI&Oacute;N VISUAL</strong> &middot; Todos los registros y valores de este panel son ficticios.':'<strong>ENTORNO DE PRUEBAS</strong> &middot; No mezclar estos valores con el recaudo real del evento.';
 $('admin-root').innerHTML=`<div class="admin-page"><div class="admin-heading"><div><span class="overline">EVENTOS Y SERVICIOS <span class="admin-heading-tag">CONTROL 2026</span></span><h1>Todo tu evento,<br>en un solo lugar.</h1><p>Fiesta Blanco y Negro &middot; 6 de noviembre de 2026</p></div><div class="admin-actions"><button type="button" class="button secondary" id="refresh-admin">Actualizar</button><a href="VISTA-PREVIA.html" class="button primary">Ver formulario &#8599;</a></div></div><nav class="admin-tabs" aria-label="Secciones administrativas">${[['dashboard','Resumen','grid'],['reservations','Reservas','list'],['tables','Mesas','people'],['tests','Pruebas ePayco','lab'],['history','Hist&oacute;rico','history']].map(([id,name,i])=>`<button type="button" data-tab="${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}>${icon(i)}${name}</button>`).join('')}</nav><div id="admin-content">${({dashboard,reservations,tables:tablePanel,tests,history}[tab])()}</div></div>`;
 $('refresh-admin').addEventListener('click',()=>demo?render():load());
 $('reservation-search')?.addEventListener('input',ev=>{query=ev.target.value;$('reservation-rows').innerHTML=reservationRows();});
 $('export-csv')?.addEventListener('click',()=>{const lines=[['Referencia','Responsable','Mesa','Personas','Socios','Invitados','Estado','Valor COP'],...data.reservations.map(r=>[r.invoice,r.responsible_name,r.table_number,r.quantity,r.member_count,r.guest_count,stateLabels[r.status],r.amount])];const blob=new Blob(['\uFEFF'+lines.map(row=>row.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(demo?'DEMOSTRACION-':'PRUEBAS-')+'reservas-2026.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
 $('load-history')?.addEventListener('click',async()=>{try{const h=await api('history',{},true);$('history-results').innerHTML=`<div class="table-scroll" style="margin-top:20px"><table class="data-table"><thead><tr><th>REGISTRO</th><th>RESPONSABLE</th><th>MESA</th><th>CANTIDAD</th><th>ESTADO ORIGINAL</th><th>CREACI&Oacute;N</th></tr></thead><tbody>${h.rows.map(r=>`<tr><td>${e(r.id.slice(0,8))}</td><td>${e(r.responsable)}</td><td>${r.mesa_id}</td><td>${r.cantidad}</td><td>${e(r.estado)}</td><td>${e(r.created_at.slice(0,10))}</td></tr>`).join('')}</tbody></table></div>`;}catch(err){$('history-results').textContent=err.message;}});
}
async function load(){try{data=await api('admin',{},true);demo=false;render();}catch(err){showLogin(err.message);}}
function detail(title,body){$('admin-dialog-title').textContent=title;$('admin-dialog-body').innerHTML=body;$('admin-dialog').showModal();}
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();}
 if(b.dataset.test){selectedTest=b.dataset.test;render();}
 if(b.dataset.detail){const r=data.reservations.find(x=>x.id===b.dataset.detail);if(!r)return;let people=[];if(!demo){try{people=(await api('detail',{id:r.id},true)).attendees;}catch(err){detail('No se pudo consultar',`<p>${e(err.message)}</p>`);return;}}detail(`Mesa ${r.table_number}`,`<p><strong>${e(r.responsible_name)}</strong></p><p>${e(r.invoice)} &middot; ${stateLabels[r.status]}</p><p>${r.quantity} asistentes &middot; ${money(r.amount)}</p>${demo?'<div class="notice-box">Registro ficticio. No contiene datos personales reales.</div>':`<div class="table-scroll"><table class="data-table"><tbody>${people.map(p=>`<tr><td>${e(p.first_name)} ${e(p.last_name)}</td><td>${e(p.kind==='member'?'Socio':'Invitado')}</td></tr>`).join('')}</tbody></table></div>`}`);}
 if(b.dataset.tableDetail){const t=data.tables.find(t=>t.number===Number(b.dataset.tableDetail));detail(`Mesa ${t.number} \u00b7 ${t.zone}`,`<p>Capacidad m\u00e1xima: ${t.capacity} puestos.</p><p>Estado: ${t.status==='available'?'Disponible':t.status==='held'?'En proceso de pago':'Confirmada'}.</p><p class="muted small">Los cambios de ocupaci\u00f3n se realizan al validar pagos. No se libera una mesa con transacci\u00f3n pendiente desde esta pantalla.</p>`);}
});
$('close-detail').addEventListener('click',()=>$('admin-dialog').close());
$('logout').addEventListener('click',async()=>{if(!demo)await logout();demo=false;data=null;$('admin-banner').hidden=true;showLogin();});
if(!CONFIG.preview&&session())load();else showLogin();
</script></body></html>
